# Santhra - full stack. Run:  docker compose up --build
# App:  http://localhost:8080     API/docs: http://localhost:8000/docs
name: santhra
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: santhra-backend
    environment:
      SANTHRA_DEVICE: cpu
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      MAX_UPLOAD_SIZE_MB: "15"
    ports:
      - "8000:8000"
    volumes:
      - santhra_data:/app/data
      - santhra_media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: santhra-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  santhra_data:
  santhra_media:
