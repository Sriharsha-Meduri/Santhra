<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#0b1020"/>
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">VisionGuard - hybrid image-quality pipeline</text>

  <!-- input -->
  <rect x="30" y="120" width="120" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="90" y="147" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Input image</text>
  <text x="90" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">decode + validate</text>

  <!-- three analyzers -->
  <rect x="230" y="52" width="180" height="56" rx="10" fill="#0e2a4a" stroke="#2563eb"/>
  <text x="320" y="76" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="600">Learned CNN</text>
  <text x="320" y="94" text-anchor="middle" fill="#93c5fd" font-size="11">class · issues · score</text>

  <rect x="230" y="122" width="180" height="56" rx="10" fill="#0d2f26" stroke="#10b981"/>
  <text x="320" y="146" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="600">CV feature engine</text>
  <text x="320" y="164" text-anchor="middle" fill="#6ee7b7" font-size="11">measured metrics</text>

  <rect x="230" y="192" width="180" height="56" rx="10" fill="#2b1d3a" stroke="#a855f7"/>
  <text x="320" y="216" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="600">Anomaly autoencoder</text>
  <text x="320" y="234" text-anchor="middle" fill="#d8b4fe" font-size="11">reconstruction residual</text>

  <!-- fusion -->
  <rect x="500" y="112" width="170" height="76" rx="10" fill="#3a2a10" stroke="#f59e0b"/>
  <text x="585" y="140" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">Fusion engine</text>
  <text x="585" y="158" text-anchor="middle" fill="#fcd34d" font-size="11">detect · severity</text>
  <text x="585" y="174" text-anchor="middle" fill="#fcd34d" font-size="11">confidence · review</text>

  <!-- explain -->
  <rect x="760" y="112" width="170" height="76" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="845" y="140" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Explainability</text>
  <text x="845" y="158" text-anchor="middle" fill="#cbd5e1" font-size="11">Grad-CAM · regions</text>
  <text x="845" y="174" text-anchor="middle" fill="#cbd5e1" font-size="11">forensics · narrative</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M150 150 L228 80"/>
    <path d="M150 150 L228 150"/>
    <path d="M150 150 L228 220"/>
    <path d="M410 80 L498 140"/>
    <path d="M410 150 L498 150"/>
    <path d="M410 220 L498 160"/>
    <path d="M670 150 L758 150"/>
  </g>
  <g fill="#475569">
    <circle cx="228" cy="80" r="3"/><circle cx="228" cy="150" r="3"/><circle cx="228" cy="220" r="3"/>
    <circle cx="498" cy="150" r="3"/><circle cx="758" cy="150" r="3"/>
  </g>

  <text x="480" y="288" text-anchor="middle" fill="#64748b" font-size="11">measured (CV) · learned (model) · fused (combined decision) - every value tagged by origin</text>
</svg>
